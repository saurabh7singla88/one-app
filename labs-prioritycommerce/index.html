<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Priority Labs — Internal Engineering Catalog</title>
<style>
  :root{
    --forest:#003e29; --dark-forest:#01271a; --mid-forest:#00532b;
    --turquoise:#75d1d0; --pistachio:#e7e5aa;
    --orange:#fe6d12; --orange-h:#d95800;
    --white:#fff; --off-white:#f7f8f7; --gray:#eef0ee;
    --text:#181e1b; --muted:#52665c; --border:#dce3de;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--off-white);color:var(--text);min-height:100vh;display:flex;flex-direction:column;line-height:1.6}

  .nav{background:var(--forest);padding:0 clamp(1.25rem,4vw,3rem);height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;border-bottom:1px solid rgba(117,209,208,.15)}
  .nav-brand{display:flex;align-items:center;gap:.75rem;text-decoration:none}
  .nav-logo{width:40px;height:40px;display:flex;align-items:center;justify-content:center}
  .nav-logo img{width:40px;height:40px;object-fit:contain;mix-blend-mode:screen;filter:brightness(1.1)}
  .nav-wordmark{display:flex;flex-direction:column;line-height:1.2}
  .nav-name{font-size:1rem;font-weight:700;color:#fff;letter-spacing:-.01em}
  .nav-sub{font-size:.625rem;color:rgba(255,255,255,.45);letter-spacing:.08em}
  .nav-pill{font-size:.6875rem;font-weight:600;color:var(--pistachio);background:rgba(231,229,170,.1);border:1px solid rgba(231,229,170,.25);padding:.3rem .875rem;border-radius:100px}

  .hero{background:linear-gradient(160deg,var(--dark-forest) 0%,var(--forest) 55%,var(--mid-forest) 100%);position:relative;overflow:hidden;padding:clamp(3.5rem,8vw,6rem) clamp(1.25rem,4vw,3rem) clamp(3rem,7vw,5rem);text-align:center}
  .hero-grid{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(117,209,208,.18) 1.4px,transparent 1.4px);background-size:28px 28px;-webkit-mask-image:radial-gradient(ellipse at center,black 30%,transparent 75%);mask-image:radial-gradient(ellipse at center,black 30%,transparent 75%)}
  .hero-glow{position:absolute;width:520px;height:520px;left:50%;top:30%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(231,229,170,.18),transparent 60%);filter:blur(40px);pointer-events:none}
  .hero::after{content:'';position:absolute;bottom:0;left:0;right:0;height:90px;background:linear-gradient(to bottom,transparent,var(--off-white));pointer-events:none}
  .hero-inner{position:relative;z-index:1;max-width:760px;margin:0 auto}
  .hero-label{display:inline-flex;align-items:center;gap:.75rem;font-size:.6875rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--turquoise);margin-bottom:1.5rem}
  .hero-label::before,.hero-label::after{content:'';display:block;width:32px;height:1px;background:linear-gradient(to right,transparent,rgba(117,209,208,.5))}
  .hero-label::after{background:linear-gradient(to left,transparent,rgba(117,209,208,.5))}
  .hero-title{font-size:clamp(2.25rem,6.5vw,4rem);font-weight:900;line-height:1.02;color:#fff;letter-spacing:-.035em;margin-bottom:1.25rem}
  .hero-title em{font-style:normal;background:linear-gradient(120deg,var(--pistachio),var(--turquoise));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
  .hero-tagline{font-size:clamp(.95rem,2vw,1.125rem);color:rgba(255,255,255,.7);max-width:520px;margin:0 auto}

  .filter-bar{padding:.875rem clamp(1.25rem,4vw,3rem);display:flex;align-items:center;gap:.875rem;flex-wrap:wrap;position:sticky;top:64px;z-index:100;backdrop-filter:blur(12px);background:rgba(255,255,255,.92);border-bottom:1px solid var(--border)}
  .filter-label{font-size:.6875rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  #filterBar{display:flex;gap:.375rem;flex-wrap:wrap;list-style:none}
  .filter-btn{display:inline-flex;align-items:center;gap:.5rem;padding:.4rem 1rem;border:1.5px solid var(--border);border-radius:100px;background:transparent;color:var(--muted);font-size:.8125rem;font-weight:500;cursor:pointer;transition:all .18s ease;line-height:1;font-family:inherit}
  .filter-btn .count{font-size:.625rem;font-weight:700;background:var(--gray);color:var(--muted);padding:.15rem .45rem;border-radius:100px;min-width:20px;text-align:center;transition:all .18s}
  .filter-btn:hover{border-color:var(--forest);color:var(--forest)}
  .filter-btn:hover .count{background:rgba(0,62,41,.08);color:var(--forest)}
  .filter-btn[aria-pressed="true"]{background:var(--forest);color:#fff;border-color:var(--forest);font-weight:600;box-shadow:0 4px 14px rgba(0,62,41,.25)}
  .filter-btn[aria-pressed="true"] .count{background:rgba(255,255,255,.18);color:#fff}
  .result-count{margin-left:auto;font-size:.75rem;color:var(--muted)}
  .result-count strong{color:var(--text);font-weight:700}

  .grid-section{flex:1;padding:2.25rem clamp(1.25rem,4vw,3rem) 4rem}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:1.25rem;max-width:1400px;margin:0 auto}
  @media (max-width:639px){#grid{grid-template-columns:1fr}}

  .card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:1.5rem;display:flex;flex-direction:column;gap:.875rem;transition:all .25s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden;animation:cardIn .45s cubic-bezier(.4,0,.2,1) both}
  @keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .card::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:var(--card-accent,var(--turquoise));transform:scaleX(0);transform-origin:left;transition:transform .3s}
  .card::after{content:'';position:absolute;top:-40px;right:-40px;width:120px;height:120px;border-radius:50%;background:var(--card-accent,var(--turquoise));opacity:0;filter:blur(40px);transition:opacity .3s}
  .card:hover{box-shadow:0 14px 40px rgba(0,62,41,.13);transform:translateY(-4px);border-color:color-mix(in srgb,var(--card-accent,var(--turquoise)) 40%,var(--border))}
  .card:hover::before{transform:scaleX(1)}
  .card:hover::after{opacity:.12}
  .card[data-category="productivity"]{--card-accent:#2ab8b6}
  .card[data-category="business"]{--card-accent:var(--orange)}

  .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem;position:relative;z-index:1}
  .card-tag{display:inline-flex;align-items:center;gap:.45rem;font-size:.6875rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:.35rem .75rem .35rem .65rem;border-radius:100px;border:1px solid transparent}
  .card-tag-dot{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 22%,transparent)}
  .card[data-category="productivity"] .card-tag{background:rgba(117,209,208,.14);color:#007573;border-color:rgba(117,209,208,.3)}
  .card[data-category="business"] .card-tag{background:rgba(254,109,18,.1);color:var(--orange-h);border-color:rgba(254,109,18,.25)}

  .card-name{font-size:1.25rem;font-weight:700;line-height:1.25;color:var(--text);letter-spacing:-.02em;position:relative;z-index:1;margin-top:.25rem}
  .card-desc{font-size:.8125rem;color:var(--muted);line-height:1.6;flex:1;position:relative;z-index:1}
  .card-owner{display:flex;align-items:center;gap:.5rem;font-size:.75rem;color:var(--muted);position:relative;z-index:1}
  .owner-avatar{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--forest),var(--mid-forest));color:#fff;font-size:.5625rem;font-weight:700;display:flex;align-items:center;justify-content:center}
  .card-footer{margin-top:.25rem;position:relative;z-index:1}
  .card-link{display:inline-flex;align-items:center;gap:.45rem;font-size:.8125rem;font-weight:600;color:#fff;background:var(--orange);text-decoration:none;padding:.5rem 1.05rem;border-radius:100px;transition:all .18s;box-shadow:0 2px 8px rgba(254,109,18,.25)}
  .card-link:hover{background:var(--orange-h);transform:translateX(2px);box-shadow:0 4px 14px rgba(254,109,18,.4)}
  .card-link svg{transition:transform .18s}
  .card-link:hover svg{transform:translate(1px,-1px)}
  .card-internal{display:inline-flex;align-items:center;gap:.4rem;font-size:.8125rem;font-weight:500;color:var(--muted);padding:.5rem 1rem;border:1.5px dashed var(--border);border-radius:100px}

  #emptyState{display:none;text-align:center;padding:5rem 1rem;color:var(--muted)}
  #emptyState strong{display:block;font-size:1.0625rem;color:var(--text);margin-bottom:.5rem}

  footer{background:var(--dark-forest);padding:1.75rem clamp(1.25rem,4vw,3rem);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem;border-top:1px solid rgba(117,209,208,.1)}
  .footer-brand{font-size:.8125rem;font-weight:600;color:rgba(255,255,255,.45)}
  .footer-brand span{color:var(--pistachio)}
  .footer-link-wrap{font-size:.8125rem;color:rgba(255,255,255,.45)}
  .footer-link{color:var(--turquoise);text-decoration:none;font-weight:600}
  .footer-link:hover{text-decoration:underline}
</style>
</head>
