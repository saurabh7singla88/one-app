services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args: 
        # The frontend will call /api/* — nginx (or express static) proxies these
        VITE_API_URL: /api
        # Enable the member insights panel — set in .env (default: false)
        VITE_ENABLE_MEMBER_INSIGHTS: ${VITE_ENABLE_MEMBER_INSIGHTS:-false}
        # Author name shown in the UI footer — set in .env (default: Nebrix)
        VITE_APP_AUTHOR: ${VITE_APP_AUTHOR:-Nebrix}

    ports:
      - "3000:47421"
    environment:
      NODE_ENV: production
      # Turso runtime connection — required for web deployment
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN}
      # JWT secret for session tokens
      JWT_SECRET: ${JWT_SECRET}
      # Optional: encryption key for stored credentials
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      # Frontend is served by Express itself — allow same-origin requests from the mapped port.
      # For production deployments replace with your real domain.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
