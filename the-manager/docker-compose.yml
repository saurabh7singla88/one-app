services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args: 
        # The frontend will call /api/* — nginx (or express static) proxies these
        VITE_API_URL: /api
        # Enable the member insights panel — set in .env (default: false)
        VITE_ENABLE_MEMBER_INSIGHTS: ${VITE_ENABLE_MEMBER_INSIGHTS:-false}
        # Author name shown in the UI footer — set in .env (default: Nebrix)
        VITE_APP_AUTHOR: ${VITE_APP_AUTHOR:-Nebrix}

    ports:
      - "${APP_PORT:-3000}:47421"
    volumes:
      - ${DATA_DIR:-./data}:/data
    environment:
      NODE_ENV: production
      # Turso runtime connection — required for web deployment
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN}
      # Local SQLite fallback — used when TURSO_DATABASE_URL is not set.
      # Data is stored in DATA_DIR (default: ./data next to docker-compose.yml).
      # Override DATA_DIR in .env to store the DB anywhere on the host.
      DATABASE_URL: ${DATABASE_URL:-file:/data/app.db}
      # JWT secret for session tokens
      JWT_SECRET: ${JWT_SECRET}
      # Optional: encryption key for stored credentials
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      # Frontend is served by Express itself — allow same-origin requests from the mapped port.
      # For production deployments replace with your real domain.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      # Externally-visible base URL used for OAuth2 redirect URIs.
      # Must match what Google sees — i.e. the host:port your browser uses.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      # Admin panel credentials
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
